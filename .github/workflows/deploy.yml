name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        env:
          PUBLICATION_READY: 'true'
          PORT: 5173
          BASE_PATH: '/'
          SITE_URL: 'https://jmletvest.co.uk/'
        run: |
          pnpm --filter @workspace/letvest-property run build

      - name: Publish built site to GitHub Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages-publish" FETCH_HEAD
          rsync -a --delete --exclude=.git artifacts/letvest-property/dist/public/ "$RUNNER_TEMP/pages-publish/"
          touch "$RUNNER_TEMP/pages-publish/.nojekyll"
          git -C "$RUNNER_TEMP/pages-publish" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/pages-publish" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/pages-publish" add -A
          if ! git -C "$RUNNER_TEMP/pages-publish" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/pages-publish" commit -m "Publish site from $GITHUB_SHA"
            git -C "$RUNNER_TEMP/pages-publish" push origin HEAD:gh-pages
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/letvest-property/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
